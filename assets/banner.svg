<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Grafana Dashboards: Kubernetes capacity, bottlenecks and SRE troubleshooting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
    <radialGradient id="glowO" cx="0.88" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="826" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#73bf69"/>
      <stop offset="0.72" stop-color="#73bf69"/>
      <stop offset="0.86" stop-color="#ff9830"/>
      <stop offset="1" stop-color="#f2495c"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5794f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5794f2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glowO)"/>
    <rect width="1280" height="320" fill="url(#glowB)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- left: title block -->
    <text x="64" y="70" fill="#ff9830" font-size="14" font-weight="600" letter-spacing="3">DEVOPS · SRE · OBSERVABILITY</text>
    <text x="62" y="124" fill="#ffffff" font-size="52" font-weight="700">Grafana Dashboards</text>
    <text x="64" y="158" fill="#9aa4b2" font-size="20">Kubernetes capacity, bottlenecks &amp; troubleshooting</text>

    <!-- stat tiles -->
    <g>
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
      <rect x="64" y="190" width="176" height="90" rx="10" fill="#37872d"/>
      <text x="80" y="214" fill="#e6f4e3" font-size="13" font-weight="600">CPU requested</text>
      <text x="80" y="262" fill="#ffffff" font-size="38" font-weight="700">77%</text>

      <rect x="254" y="190" width="176" height="90" rx="10" fill="#37872d"/>
      <text x="270" y="214" fill="#e6f4e3" font-size="13" font-weight="600">CPU actually used</text>
      <text x="270" y="262" fill="#ffffff" font-size="38" font-weight="700">5%</text>

      <rect x="444" y="190" width="176" height="90" rx="10" fill="#e0752d"/>
      <text x="460" y="214" fill="#fff1e6" font-size="13" font-weight="600">Pod slots used</text>
      <text x="460" y="262" fill="#ffffff" font-size="38" font-weight="700">84%</text>
    </g>

    <!-- right: mini bar-gauge panel -->
    <rect x="700" y="38" width="540" height="244" rx="14" fill="#0f1628" fill-opacity="0.92" stroke="#2a3550"/>
    <text x="724" y="70" fill="#d8dee9" font-size="15" font-weight="600">Memory requested % of allocatable, per node</text>

    <g font-size="13" fill="#8b95a7">
      <text x="724" y="103">node-a</text>
      <text x="724" y="137">node-b</text>
      <text x="724" y="171">node-c</text>
      <text x="724" y="205">node-d</text>
      <text x="724" y="239">node-e</text>
    </g>

    <g fill="#1d2538">
      <rect x="826" y="89" width="324" height="20" rx="3"/>
      <rect x="826" y="123" width="324" height="20" rx="3"/>
      <rect x="826" y="157" width="324" height="20" rx="3"/>
      <rect x="826" y="191" width="324" height="20" rx="3"/>
      <rect x="826" y="225" width="324" height="20" rx="3"/>
    </g>

    <g fill="url(#bar)">
      <rect x="826" y="89" width="285" height="20" rx="3"><animate attributeName="width" from="0" to="285" dur="1.0s" fill="freeze"/></rect>
      <rect x="826" y="123" width="181" height="20" rx="3"><animate attributeName="width" from="0" to="181" dur="1.1s" fill="freeze"/></rect>
      <rect x="826" y="157" width="314" height="20" rx="3"><animate attributeName="width" from="0" to="314" dur="1.2s" fill="freeze"/></rect>
      <rect x="826" y="191" width="133" height="20" rx="3"><animate attributeName="width" from="0" to="133" dur="1.3s" fill="freeze"/></rect>
      <rect x="826" y="225" width="236" height="20" rx="3"><animate attributeName="width" from="0" to="236" dur="1.4s" fill="freeze"/></rect>
    </g>

    <g font-size="17" font-weight="700" text-anchor="end">
      <text x="1222" y="105" fill="#ff9830">88%</text>
      <text x="1222" y="139" fill="#73bf69">56%</text>
      <text x="1222" y="173" fill="#f2495c">97%</text>
      <text x="1222" y="207" fill="#73bf69">41%</text>
      <text x="1222" y="241" fill="#73bf69">73%</text>
    </g>

    <!-- sparkline along the bottom of the panel -->
    <path d="M702 280 L702 276.0 L760 272.6 L820 274.9 L880 268.7 L940 270.9 L1000 264.8 L1060 267.0 L1120 260.8 L1180 263.6 L1238 258.0 L1238 280 Z" fill="url(#spark)"/>
    <polyline points="702,276.0 760,272.6 820,274.9 880,268.7 940,270.9 1000,264.8 1060,267.0 1120,260.8 1180,263.6 1238,258.0" fill="none" stroke="#5794f2" stroke-width="2" stroke-dasharray="600" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.6s" fill="freeze"/>
    </polyline>
  </g>
</svg>
